[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-bridge"
version = "0.1.0"
description = "File-based EMS superquadric fitting pipeline for shape completion experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.57",
    "scikit-learn>=1.3",
    "plyfile>=0.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.scripts]
ems-fit = "ems_bridge.cli:fit_main"
ems-ablation = "ems_bridge.cli:ablation_main"

[tool.setuptools.packages.find]
where = ["src"]
